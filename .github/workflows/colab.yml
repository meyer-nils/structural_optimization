name: Publish Colab notebooks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish_colab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate Colab notebooks
        run: python tools/make_colab.py --out build

      - name: Publish to colab branch
        working-directory: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b colab
          git add .
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -qm "Colab notebooks for ${GITHUB_SHA}"
          git push -q --force \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" colab
